<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrito | Maroba Store</title>

<link rel="stylesheet" href="style.css">

</head>


<body>
<!-- HEADER -->
<header class="header">

  <a href="index.html" class="logo">
    <img src="img/logo-maroba.png" alt="Maroba Store">
  </a>

  <nav class="nav">
    <a href="index.html">Inicio</a>
    <a href="#productos">Tienda</a>
    <a href="#recomendados">Recomendados</a>
    <a href="#contacto">Contacto</a>
  </nav>

  <a
    class="cart"
    href="carrito.html"
    aria-label="Carrito de compras"
  >
    🛒
  </a>

</header>

<header>

    <h1>
        Tu carrito
    </h1>


    <a href="index.html">
        Seguir comprando
    </a>

</header>



<main class="cart-container">


    <h2>
        Tus productos
    </h2>


    <div id="cart-items">

    </div>


    <div class="cart-summary">


        <h2>
            Total: Bs 
            <span id="cart-total">
                0
            </span>
        </h2>


        <button onclick="finalizarCompra()">
            Finalizar compra por WhatsApp
        </button>


    </div>


</main>



<script src="cart.js"></script>

<script>


const cartItems = document.getElementById("cart-items");

const cartTotal = document.getElementById("cart-total");

let total = 0;

let carrito = [];



function getProductoKey(producto) {
  return [
    String(producto.nombre ?? "").trim(),
    Number(producto.precio) || 0,
    String(producto.colorFunda ?? "").trim(),
    String(producto.colorIphone ?? "").trim(),
    String(producto.entrega ?? "").trim(),
  ].join("\x1f");
}



function agruparProductosRepetidos(carritoRaw) {
  const agrupados = [];
  const indicePorClave = {};

  carritoRaw.forEach((producto) => {
    const key = getProductoKey(producto);
    const cantidad = Number(producto.cantidad) || 1;

    if (indicePorClave[key] !== undefined) {
      agrupados[indicePorClave[key]].cantidad += cantidad;
    } else {
      indicePorClave[key] = agrupados.length;
      agrupados.push({
        nombre: producto.nombre,
        precio: producto.precio,
        cantidad: cantidad,
        colorFunda: producto.colorFunda ?? "",
        colorIphone: producto.colorIphone ?? "",
        entrega: producto.entrega ?? "",
      });
    }
  });

  return agrupados;
}



function renderizarProductos() {
  carrito = agruparProductosRepetidos(getCart());
  total = 0;
  cartItems.innerHTML = "";

  if (carrito.length === 0) {
    cartItems.innerHTML = `
<h3>
Tu carrito está vacío
</h3>
`;
    cartTotal.innerHTML = 0;
    return;
  }

  carrito.forEach((producto, index) => {
    total += producto.precio * producto.cantidad;

    cartItems.innerHTML += `

<div class="cart-product">

<img 
src="img/silicona-17pro-blanco.jpg"
class="cart-image"
>

<div class="cart-info">

<h3>
${producto.nombre}
</h3>

<p>
Cantidad: ${producto.cantidad}
</p>

<p>
Precio unitario: Bs ${producto.precio}
</p>

<p>
Subtotal: Bs ${producto.precio * producto.cantidad}
</p>

<button onclick="eliminarProducto(${index})">
Eliminar
</button>

</div>

</div>

`;
  });

  cartTotal.innerHTML = total;
}



renderizarProductos();



function eliminarProducto(index) {
  const producto = carrito[index];

  if (!producto) {
    return;
  }

  const key = getProductoKey(producto);
  const carritoActualizado = getCart().filter(
    (item) => getProductoKey(item) !== key
  );

  saveCart(carritoActualizado);
  location.reload();
}




function finalizarCompra(){


let mensaje = 
"Hola, quiero realizar una compra:%0A%0A";


carrito.forEach(producto=>{


mensaje += 
`${producto.nombre} x${producto.cantidad} - Bs ${producto.precio}%0A`;


});



mensaje += 
`%0ATotal: Bs ${total}`;



window.open(

"https://wa.me/59164465212?text=" + mensaje,

"_blank"

);


}


</script>



</body>

</html>
